[package]
name = "pinc-sarai"
version = "3.0.0"
description = "SARAI — All Transactions. Securely. — Powered by PINC Platform"
authors = ["PINC Platform", "SARAI Team — Powered by PINC"]
repository = "https://pinc.network"
homepage = "https://pinc.network"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pinc_sarai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# admin feature enables real HD wallet generation (bip39 + ethers). SARAI builds WITHOUT this flag → watch-only only.
admin = ["dep:bip39", "dep:ethers-core", "dep:ethers-signers"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-http = "2"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
thiserror = "1"
anyhow = "1"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
hmac = "0.12"
bip39 = { version = "2", optional = true }
ethers-core = { version = "2.0", optional = true }
ethers-signers = { version = "2.0", optional = true }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
qrcode = { version = "0.14", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
hostname = "0.3"
num_cpus = "1"
sysinfo = "0.30"
time = { version = "0.3", features = ["serde"] }
async-trait = "0.1"
futures-util = "0.3"
tokio-tungstenite = "0.26"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 16
lto = false
opt-level = "s"
strip = true

[dev-dependencies]
tempfile = "3"
