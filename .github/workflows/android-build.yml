name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.0.12077973" "build-tools;34.0.0" "platforms;android-34"
          NDK_BIN="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK_BIN=$NDK_BIN" >> $GITHUB_ENV
          echo "$NDK_BIN" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Set Android cross-compilation env
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android34-clang" >> $GITHUB_ENV
          echo "CXX_aarch64_linux_android=$NDK_BIN/aarch64-linux-android34-clang++" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android34-clang" >> $GITHUB_ENV

      - name: Install cargo-tauri
        run: cargo install tauri-cli

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Initialize Android project
        run: cd src-tauri && npx tauri android init
        continue-on-error: true

      - name: Build Android APK
        run: cd src-tauri && npx tauri android build --target aarch64
        timeout-minutes: 30

      - name: Find APK
        id: find-apk
        run: |
          APK_PATH=$(find src-tauri/gen/android -name "*.apk" -type f 2>/dev/null | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Sign APK
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias pinc-release -keyalg RSA -keysize 2048 -validity 10000 -storepass pinc123 -dname "CN=PINC, OU=Dev, O=PINC, L=Unknown, ST=Unknown, C=US"
          APK_PATH="${{ steps.find-apk.outputs.apk_path }}"
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            zipalign -v 4 "$APK_PATH" pinc-aligned.apk
            apksigner sign --ks release.keystore --ks-pass pass:pinc123 --ks-key-alias pinc-release --out pinc-android.apk pinc-aligned.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinc-android
          path: pinc-android.apk
          retention-days: 7

  build-admin-android:
    runs-on: ubuntu-latest
    needs: build-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.0.12077973" "build-tools;34.0.0" "platforms;android-34"
          NDK_BIN="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK_BIN=$NDK_BIN" >> $GITHUB_ENV
          echo "$NDK_BIN" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Set Android cross-compilation env
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android34-clang" >> $GITHUB_ENV
          echo "CXX_aarch64_linux_android=$NDK_BIN/aarch64-linux-android34-clang++" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android34-clang" >> $GITHUB_ENV

      - name: Install cargo-tauri
        run: cargo install tauri-cli

      - name: Install frontend dependencies
        working-directory: pinc-admin
        run: npm install

      - name: Build frontend
        working-directory: pinc-admin
        run: npx vite build

      - name: Initialize Android project
        working-directory: pinc-admin/src-tauri
        run: npx tauri android init
        continue-on-error: true

      - name: Build Admin Android APK
        working-directory: pinc-admin/src-tauri
        run: npx tauri android build --target aarch64
        timeout-minutes: 30

      - name: Find APK
        id: find-apk
        run: |
          APK_PATH=$(find pinc-admin/src-tauri/gen/android -name "*.apk" -type f 2>/dev/null | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Sign APK
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias pinc-admin -keyalg RSA -keysize 2048 -validity 10000 -storepass pinc123 -dname "CN=PINC Admin, OU=Dev, O=PINC, L=Unknown, ST=Unknown, C=US"
          APK_PATH="${{ steps.find-apk.outputs.apk_path }}"
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            zipalign -v 4 "$APK_PATH" pinc-admin-aligned.apk
            apksigner sign --ks release.keystore --ks-pass pass:pinc123 --ks-key-alias pinc-admin --out pinc-admin-android.apk pinc-admin-aligned.apk
          fi

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: pinc-admin-android
          path: pinc-admin-android.apk
          retention-days: 7
