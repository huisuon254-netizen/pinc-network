[package]
name = "pinc"
version = "3.0.0"
edition = "2021"

[lib]
name = "pinc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Cryptography
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = "2"
hkdf = "0.12"
rand = "0.8"
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1"
argon2 = "0.5"

# Identity
uuid = { version = "1", features = ["v4"] }
bip39 = "2"
base64 = "0.22"
hex = "0.4"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Compression
flate2 = "1"
zstd = "0.13"

# System info
hostname = "0.3"
num_cpus = "1"
chrono = { version = "0.4", features = ["serde"] }

# Network — Phase 3
quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }
rcgen = "0.13"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# QR Code generation
qrcode = "0.14"
image = { version = "0.25", features = ["png"] }

# P2P Discovery
libp2p = { version = "0.55", features = ["kad", "mdns", "identify", "ping", "tcp", "quic", "noise", "yamux", "dcutr", "relay", "websocket", "autonat", "request-response"] }
multiaddr = "0.18"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 16
opt-level = "s"
lto = false
strip = true

[dev-dependencies]
tempfile = "3"
