[package]
name = "pinc"
version = "3.0.0"
edition = "2021"

[lib]
name = "pinc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["protocol-asset"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Cryptography
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
rand = "0.8"
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1"
argon2 = "0.5"

# Identity
uuid = { version = "1", features = ["v4"] }
bip39 = "2"
base64 = "0.22"
hex = "0.4"
ethers-core = "2.0"
ethers-signers = "2.0"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Compression
flate2 = "1"
zstd = "0.13"

# System info
hostname = "0.3"
num_cpus = "1"
sysinfo = "0.30"
chrono = { version = "0.4", features = ["serde"] }
time = ">=0.3.47"

# Network — Phase 3
quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "blocking"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
async-trait = "0.1"

# System directories
dirs = "5"
libc = "0.2"

# QR Code generation
qrcode = { version = "0.14", features = ["image"] }
image = { version = "0.25", features = ["png"] }

# Tauri plugins
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-http = "2"
tauri-plugin-deep-link = "2"

# P2P Discovery — TCP-based (no libp2p dependency)

# AI Phase 10 — Desktop only (not Android)
[target.'cfg(not(target_os = "android"))'.dependencies]
whisper-rs = "0.5"
llama-rs = "0.16.1"
ort = { version = "2.0.0-rc.12", features = ["ndarray"] }
ndarray = "0.16"
redis = "0.23"
hostname = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
hostname = "0.3"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 16
opt-level = "s"
lto = false
strip = true

[target.'cfg(target_os = "android")'.profile.release]
opt-level = "s"
lto = false
strip = true
codegen-units = 16

[dev-dependencies]
tempfile = "3"
